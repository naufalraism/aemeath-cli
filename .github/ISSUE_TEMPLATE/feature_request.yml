name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the CLI to do?
      description: Sketch the command you would like to run and what it should create.
      render: shell
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
