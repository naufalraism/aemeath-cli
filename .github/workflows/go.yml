name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -cover ./...

  generated-projects:
    name: Generated projects build against the framework
    runs-on: ubuntu-latest
    # The generated tests of PostgreSQL and MySQL projects run against these
    # (TEST_DATABASE_URL), not only against SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: generated_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: generated_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
    - uses: actions/checkout@v4

    # The framework's main branch: a template that no longer compiles against it fails here.
    - uses: actions/checkout@v4
      with:
        repository: naufalraism/aemeath
        path: .framework

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Create, build, vet and test a project from every template
      env:
        AEMEATH_FRAMEWORK_DIR: ${{ github.workspace }}/.framework
        AEMEATH_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/generated_test?sslmode=disable
        AEMEATH_TEST_MYSQL_URL: root:root@tcp(localhost:3306)/generated_test
      run: go test ./internal/cli -run TestGeneratedProjectsBuild -v

  release-config:
    name: GoReleaser configuration
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: "~> v2"
        args: check
