name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -cover ./...

  generated-projects:
    name: Generated projects build against the framework
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The framework's main branch: a template that no longer compiles against it fails here.
    - uses: actions/checkout@v4
      with:
        repository: naufalraism/aemeath
        path: .framework

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Create, build, vet and test a project from every template
      env:
        AEMEATH_FRAMEWORK_DIR: ${{ github.workspace }}/.framework
      run: go test ./internal/cli -run TestGeneratedProjectsBuild -v

  release-config:
    name: GoReleaser configuration
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: "~> v2"
        args: check
